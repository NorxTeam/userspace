schema = "gamma-recipe"
schema_version = 1
status = "staging"

[package]
name = "rust-userspace"
version = "0.1.0"
release = 1
license = "GPL-3.0-only"
abi = "norx-userspace-abi-v1"
architectures = ["x86_64", "aarch64"]

[source]
kind = "workspace"
subdir = "userspace/rust"

[build]
system = "command"
command = "python"
args = ["toolchain/scripts/build-rust-userspace.py"]
network = false

[targets.x86_64]
triple = "x86_64-unknown-norx"

[targets.aarch64]
triple = "aarch64-unknown-norx"

[[outputs]]
name = "rust-userspace"
kind = "runtime"
paths = ["usr/lib", "tests/rust"]
