schema = "norx-platform-abi"
schema_version = 1
abi_version = 2
word_bits = 64
pointer_bits = 64
max_args = 6
error_min = 1
error_max = 4095
scheduler_hz = 100

[ownership]
fd_kind = "process-owned descriptor"
fd_owner = "calling process"
fd_lifetime = "until close or process exit"
fd_stale_error = "EBADF"
fd_transfer = "dup2 or explicitly requested spawn2 inheritance"
kernel_handle_rule = "raw VFS and pipe handles never cross the syscall boundary"

[[limits]]
name = "io"
c_name = "NORX_MAX_IO"
