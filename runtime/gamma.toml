schema = "gamma-recipe"
schema_version = 1
status = "staging"

[package]
name = "runtime"
version = "0.1.0"
release = 1
license = "GPL-3.0-only"
abi = "norx-userspace-abi-v2"
architectures = ["aarch64"]

[source]
kind = "workspace"
subdir = "userspace/runtime"

[build]
system = "command"
command = "python"
args = ["toolchain/scripts/build-runtime.py"]
network = false

[targets.aarch64]
triple = "aarch64-unknown-norx"

[[outputs]]
name = "runtime"
kind = "runtime"
paths = ["usr/lib", "tests/runtime"]
